# Install: pre-commit install
# Run manually: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
        exclude: ^(src/messages|tsconfig\.json)  # JSONC / bilingual translations
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: local
    hooks:
      - id: prettier
        name: prettier (via npx)
        entry: npx --no-install prettier --write
        language: system
        types_or: [ts, tsx, json, css, markdown]
        exclude: ^(src/client|src/messages|node_modules|\.next)
      - id: eslint
        name: eslint (via npx)
        entry: npx --no-install eslint --fix
        language: system
        types_or: [ts, tsx]
        exclude: ^(src/client|node_modules|\.next)
      - id: tsc
        name: typescript check
        entry: npx --no-install tsc --noEmit
        language: system
        pass_filenames: false
        types_or: [ts, tsx]
