[project]
name = "tariq-auth-backend"
version = "0.2.0"
description = "Tariq AI authentication backend — Keycloak resource server"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "authlib>=1.3.2",
    "bcrypt>=4.2,<5",
    "email-validator>=2.3.0",
    "fastapi>=0.133.0",
    "gunicorn>=23.0.0; sys_platform != 'win32'",
    "httpx>=0.28.1",
    "orjson>=3.10",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.1",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.47",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
target-version = "py313"
line-length = 100
# NOTE: `extend-exclude` (not `exclude`) — `exclude` REPLACES ruff's defaults
# (.venv, node_modules, build, dist, etc.), which would let `ruff format .`
# reformat your virtualenv. Always use `extend-exclude` to add paths.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "ARG",  # unused arguments
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in argument defaults (FastAPI uses this)
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ["alembic/versions/"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "app.alembic.*"
ignore_errors = true
